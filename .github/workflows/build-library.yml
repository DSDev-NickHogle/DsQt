name: Build Library

on:
  workflow_dispatch:
  push:
    paths:
      - 'Library/**'
      - 'Tools/ProjectCloner/**'
      - 'Examples/ClonerSource/**'

permissions:
  contents: write
  checks: write

jobs:
  build:
    # Off by default. Set the repository variable BUILD_LIBRARY_ENABLED to 'true' to enable.
    if: vars.BUILD_LIBRARY_ENABLED == 'true' && (github.ref_name == 'main' || github.ref_name == vars.BUILD_LIBRARY_TEST_BRANCH)
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Read version
      id: version
      shell: bash
      run: |
        VERSION=$(git describe --tags --match "library/*" --always 2>/dev/null || git describe --tags --always 2>/dev/null || echo "0.2.0")
        VERSION_CLEAN=$(echo "$VERSION" | sed -E 's/^(library\/v?|v)//')
        echo "version=$VERSION_CLEAN" >> "$GITHUB_OUTPUT"
        echo "Building DsQt v${VERSION_CLEAN} (CI Run #${{ github.run_number }})"

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Setup Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.10.*'
        arch: win64_msvc2022_64
        modules: 'qtshadertools qtmultimedia qtwebsockets'

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      env:
        VCPKG_BINARY_SOURCES: default,rw
      with:
        vcpkgDirectory: '${{ github.workspace }}/vcpkg'
        vcpkgGitCommitId: '4b77da7fed37817f124936239197833469f1b9a8'
      

    - name: Set up binary cache
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: ${{ runner.os }}-vcpkg-binary-cache-${{ hashFiles('vcpkg*.json') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-binary-cache-

    - name: Configure
      shell: cmd
      run: >
        cmake -S Library -B Library/build/ci
        -G "Visual Studio 17 2022" -A x64
        -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
        -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install"
        -DDSQT_BUILD_TESTS=ON

    - name: Build Release
      shell: cmd
      run: cmake --build Library/build/ci --config Release

    - name: Build Debug
      shell: cmd
      run: cmake --build Library/build/ci --config Debug

    - name: Run Tests
      shell: cmd
      run: ctest --test-dir Library/build/ci --build-config Debug --output-on-failure --output-junit test-results.xml

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: Library/build/ci/test-results.xml

    - name: Test Report
      if: always()
      uses: dorny/test-reporter@v1
      with:
        name: Qt Unit Tests
        path: Library/build/ci/Tests/**/test_*.xml
        reporter: java-junit

    - name: Install Release
      shell: cmd
      run: cmake --install Library/build/ci --config Release

    - name: Install Debug
      shell: cmd
      run: cmake --install Library/build/ci --config Debug

    - name: Configure ProjectCloner
      shell: cmd
      run: >
        cmake -S Tools/ProjectCloner -B Tools/ProjectCloner/build/ci
        -G "Visual Studio 17 2022" -A x64
        -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install/Tools/ProjectCloner"

    - name: Build ProjectCloner
      shell: cmd
      run: cmake --build Tools/ProjectCloner/build/ci --config Release

    - name: Install ProjectCloner
      shell: cmd
      run: cmake --install Tools/ProjectCloner/build/ci --config Release

    - name: Copy ClonerSource template
      shell: bash
      run: |
        cp -r "${{ github.workspace }}/Examples/ClonerSource" "${{ github.workspace }}/install/Tools/ClonerSource"

    - name: Package artifacts
      shell: bash
      run: |
        cd "${{ github.workspace }}/install"
        7z a "${{ github.workspace }}/dsqt-${{ steps.version.outputs.version }}.zip" .

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: dsqt-${{ steps.version.outputs.version }}
        path: ${{ github.workspace }}/dsqt-${{ steps.version.outputs.version }}.zip

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/library/v')
      uses: softprops/action-gh-release@v2
      with:
        name: "DsQt Library ${{ steps.version.outputs.version }}"
        body: |
          Official release of DsQt Library.
          Version: ${{ steps.version.outputs.version }}
          Commit: ${{ github.sha }}
        files: dsqt-${{ steps.version.outputs.version }}.zip
